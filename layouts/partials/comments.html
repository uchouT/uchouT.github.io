<script>
        (() => {
                const loadUtterances = () => {
                        // 清除已有 utterances 容器，避免重复加载
                        const existingFrame = document.querySelector('.utterances');
                        if (existingFrame) existingFrame.remove();

                        // 选择主题
                        const isDarkMode = document.body.classList.contains('dark');
                        const theme = isDarkMode ? 'github-dark' : 'github-light';

                        // 创建新的 utterances 容器
                        const container = document.createElement('div');
                        container.classList.add('utterances');
                        document.body.appendChild(container); // 插入到 body 中

                        // 创建 script 标签
                        const script = document.createElement('script');
                        script.src = 'https://utteranc.es/client.js';
                        script.async = true;
                        script.setAttribute('repo', 'uchouT/uchouT.github.io'); 
                        script.setAttribute('issue-term', 'title');
                        script.setAttribute('theme', theme);
                        script.setAttribute('label', 'Comment');
                        script.setAttribute('crossorigin', 'anonymous');

                        container.appendChild(script); // 插入 script，让 utterances 渲染
                };

                // 初次加载
                loadUtterances();

                // 监听 dark 模式切换
                const observer = new MutationObserver(() => {
                        loadUtterances(); // 重新加载 utterances
                });
                observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        })();
</script>

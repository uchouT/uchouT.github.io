# serene v6.0.0
#
# - docs: https://github.com/isunjn/serene/blob/latest/USAGE.md
# - check for updates: https://github.com/isunjn/serene/releases
#
# =========================================================================================

base_url = "https://uchout.moe"
title = "uchouT's Gensokyo"
description = "uchouT 的幻想乡"
author = "uchouT"
default_language = "zh"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = false  # Keep this false, as it may cause issues with some styles
build_search_index = false  # Keep this false, search is temporarily unsupported
generate_feeds = false  # Whether to generate a feed file in root, read docs for more info about rss feed
feed_filenames = [
  "feed.xml"
]  # "feed.xml" | "atom.xml" | "rss.xml", read docs for more info
taxonomies = [{ name = "tags", feed = true }, { name = "categories", feed = true }]

[markdown]
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true
bottom_footnotes = true

[markdown.highlighting]
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
nav = [
  { name = "posts", path = "/posts" },
  { name = "tags", path = "/tags" },
  { name = "about", path = "/about" },
]
blog_section_path = "/posts"  # Main blog section, used by home page's recent posts and tags pages

# Your info on the home page
name = "uchouT"
bio = "Just for fun."
avatar = "img/self_small.jpg"
links = [
  { name = "GitHub", icon = "github", url = "https://github.com/uchouT" },
  { name = "Twitter/x", icon = "twitter-x", url = "https://x.com/0x_uchouT" },
  { name = "Telegram", icon = "telegram", url = "https://t.me/uchouT" },
  { name = "Email", icon = "email", url = "mailto:i@uchout.moe" },
]

back_link_text = "Return"  # Text of the back button
color_scheme = "auto"  # "auto" | "light" | "dark"

footer_copyright = "© uchouT"
footer_credits = true  # Whether to show "Built with zola and serene" in footer

# Site-wide defaults, can be overridden in a section's `_index.md` and again in a post's front-matter
date_format = "%b %-d, %Y"

not_found_error_text = "404 Not Found"
not_found_recover_text = "« return to home »"

reaction = false  # Whether to enable anonymous emoji reactions (Note: You need to set up a working api endpoint to enable this feature)
reaction_align = "right"  # "left" | "center" | "right"
reaction_endpoint = "https://example.com/api/reaction"

    <section id="brief" class="prose">
      <p>Hi, I'm uchouT. Linux lover / Rustacean / Homelab player.</p>
<p>这里是我的个人博客, 随缘记录一些折腾日记和思考.</p>
<p>我不是个喜欢表露自己的人, 不过最近意识到自己有点太过封闭了, 丢失了很多认识有趣的人和受到反馈的机会. 遂正在尝试输出一些内容, 企图吸引一些同好, 同时也算是践行一下费曼学习法了.</p>
<p>For more, please visit <a href="https://uchout.moe/./about">about page</a>.</p>
